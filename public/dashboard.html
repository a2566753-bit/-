<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - أداة سنتر الليث</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f7fa;
    }

    .navbar {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .navbar h1 {
      font-size: 24px;
    }

    .navbar button {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid white;
      padding: 8px 16px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }

    .navbar button:hover {
      background: white;
      color: #667eea;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 30px;
      margin-bottom: 20px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
    }

    .card h2 {
      color: #333;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
    }

    input[type="file"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
    }

    input[type="file"]:focus,
    input[type="email"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #667eea;
    }

    .btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: transform 0.2s;
      margin-right: 10px;
      margin-top: 10px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .products-list {
      margin-top: 20px;
    }

    .product-item {
      background: #f9f9f9;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid #667eea;
    }

    .product-info h4 {
      color: #333;
      margin-bottom: 5px;
    }

    .product-info p {
      color: #999;
      font-size: 13px;
    }

    .btn-delete {
      background: #f44336;
      color: white;
      padding: 6px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
    }

    .btn-delete:hover {
      background: #d32f2f;
    }

    .message {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      border-left: 4px solid #28a745;
      display: block;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      border-left: 4px solid #dc3545;
      display: block;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-box {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }

    .stat-box h3 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .stat-box p {
      font-size: 14px;
      opacity: 0.9;
    }

    .loading {
      text-align: center;
      padding: 20px;
      display: none;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }

      .navbar {
        flex-direction: column;
        gap: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="navbar">
    <h1>🎯 أداة سنتر الليث</h1>
    <div>
      <span id="userEmail"></span>
      <button onclick="logout()">تسجيل الخروج</button>
    </div>
  </div>

  <div class="container">
    <div class="stats">
      <div class="stat-box">
        <h3 id="productsCount">0</h3>
        <p>عدد المنتجات المُحمّلة</p>
      </div>
      <div class="stat-box">
        <h3>📂</h3>
        <p>جاهز لإضافة المنتجات</p>
      </div>
    </div>

    <div class="message" id="message"></div>

    <!-- بطاقة رفع الملف -->
    <div class="card">
      <h2>📁 رفع ملف المنتجات</h2>
      <p style="color: #999; margin-bottom: 15px;">قم برفع ملف CSV يحتوي على بيانات المنتجات (الاسم، السعر، الوصف، رابط الصورة)</p>
      
      <div class="form-group">
        <label>اختر ملف CSV</label>
        <input type="file" id="fileInput" accept=".csv" required>
      </div>
      
      <button class="btn" onclick="uploadFile()">📤 رفع الملف</button>
    </div>

    <!-- قائمة المنتجات -->
    <div class="card">
      <h2>📦 المنتجات المُحمّلة</h2>
      <div class="products-list" id="productsList">
        <p style="color: #999;">لم يتم تحميل أي منتجات حتى الآن</p>
      </div>
    </div>

    <!-- ربط فيسبوك وبدء الإضافة -->
    <div class="card">
      <h2>🔗 ربط فيسبوك وبدء الإضافة</h2>
      
      <div class="grid-2">
        <div>
          <h3 style="margin-bottom: 15px;">بيانات حسابك الشخصي</h3>
          <div class="form-group">
            <label>البريد الإلكتروني للفيسبوك</label>
            <input type="email" id="fbEmail" placeholder="أدخل بريد فيسبوك">
          </div>
          <div class="form-group">
            <label>كلمة المرور</label>
            <input type="password" id="fbPassword" placeholder="أدخل كلمة المرور">
          </div>
        </div>

        <div style="display: flex; flex-direction: column; justify-content: flex-end;">
          <button class="btn" onclick="connectFacebook()">🔐 ربط فيسبوك</button>
          <button class="btn" onclick="startAddingProducts()" id="startBtn" disabled>▶️ بدء إضافة المنتجات</button>
        </div>
      </div>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>جاري المعالجة...</p>
    </div>
  </div>

  <script>
    let facebookConnected = false;

    async function loadUserData() {
      try {
        const response = await fetch('/api/auth/user');
        const data = await response.json();
        if (response.ok) {
          document.getElementById('userEmail').textContent = '👤 ' + data.email;
        }
      } catch (error) {
        console.error(error);
      }
    }

    async function uploadFile() {
      const fileInput = document.getElementById('fileInput');
      if (!fileInput.files.length) {
        showMessage('❌ اختر ملفاً أولاً', 'error');
        return;
      }

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);

      showLoading(true);
      try {
        const response = await fetch('/api/products/upload', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();
        showLoading(false);

        if (response.ok) {
          showMessage('✅ ' + data.message, 'success');
          loadProducts();
        } else {
          showMessage('❌ ' + data.error, 'error');
        }
      } catch (error) {
        showLoading(false);
        showMessage('❌ خطأ: ' + error.message, 'error');
      }
    }

    async function loadProducts() {
      try {
        const response = await fetch('/api/products/list');
        const data = await response.json();

        document.getElementById('productsCount').textContent = data.count;

        if (data.products.length === 0) {
          document.getElementById('productsList').innerHTML = '<p style="color: #999;">لم يتم تحميل أي منتجات</p>';
          return;
        }

        let html = '';
        data.products.forEach((product, index) => {
          html += `
            <div class="product-item">
              <div class="product-info">
                <h4>${product.name}</h4>
                <p>💰 السعر: ${product.price} | 📝 ${product.description.substring(0, 50)}...</p>
              </div>
              <button class="btn-delete" onclick="deleteProduct(${index})">❌ حذف</button>
            </div>
          `;
        });

        document.getElementById('productsList').innerHTML = html;
      } catch (error) {
        console.error(error);
      }
    }

    async function deleteProduct(index) {
      try {
        const response = await fetch(`/api/products/${index}`, { method: 'DELETE' });
        const data = await response.json();

        if (response.ok) {
          showMessage('✅ تم حذف المنتج', 'success');
          loadProducts();
        } else {
          showMessage('❌ ' + data.error, 'error');
        }
      } catch (error) {
        showMessage('❌ خطأ: ' + error.message, 'error');
      }
    }

    async function connectFacebook() {
      const fbEmail = document.getElementById('fbEmail').value;
      const fbPassword = document.getElementById('fbPassword').value;

      if (!fbEmail || !fbPassword) {
        showMessage('❌ أدخل بيانات فيسبوك', 'error');
        return;
      }

      showLoading(true);
      try {
        const response = await fetch('/api/auth/connect-facebook', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ facebookEmail: fbEmail, facebookPassword: fbPassword })
        });

        const data = await response.json();
        showLoading(false);

        if (response.ok) {
          showMessage('✅ ' + data.message, 'success');
          facebookConnected = true;
          document.getElementById('startBtn').disabled = false;
        } else {
          showMessage('❌ ' + data.error, 'error');
        }
      } catch (error) {
        showLoading(false);
        showMessage('❌ خطأ: ' + error.message, 'error');
      }
    }

    async function startAddingProducts() {
      if (!facebookConnected) {
        showMessage('❌ قم بربط فيسبوك أولاً', 'error');
        return;
      }

      const fbEmail = document.getElementById('fbEmail').value;
      const fbPassword = document.getElementById('fbPassword').value;

      showLoading(true);
      try {
        const response = await fetch('/api/catalog/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ facebookEmail: fbEmail, facebookPassword: fbPassword })
        });

        const data = await response.json();
        showLoading(false);

        if (response.ok) {
          showMessage('✅ ' + data.message, 'success');
        } else {
          showMessage('❌ ' + data.error, 'error');
        }
      } catch (error) {
        showLoading(false);
        showMessage('❌ خطأ: ' + error.message, 'error');
      }
    }

    function showMessage(msg, type) {
      const messageEl = document.getElementById('message');
      messageEl.textContent = msg;
      messageEl.className = 'message ' + type;
      setTimeout(() => messageEl.style.display = 'none', 5000);
    }

    function showLoading(show) {
      document.getElementById('loading').style.display = show ? 'block' : 'none';
    }

    async function logout() {
      try {
        await fetch('/api/auth/logout', { method: 'POST' });
        window.location.href = '/';
      } catch (error) {
        console.error(error);
      }
    }

    loadUserData();
    loadProducts();
  </script>
</body>
</html>
