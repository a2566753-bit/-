<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أداة سنتر الليث</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 100%;
      padding: 40px;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      color: #667eea;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .logo p {
      color: #999;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #667eea;
    }

    .form-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid #e0e0e0;
    }

    .form-tabs button {
      flex: 1;
      padding: 12px;
      border: none;
      background: transparent;
      color: #999;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
    }

    .form-tabs button.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }

    .form-content {
      display: none;
    }

    .form-content.active {
      display: block;
    }

    button.btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
      margin-top: 10px;
    }

    button.btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #999;
    }

    .link a {
      color: #667eea;
      text-decoration: none;
      cursor: pointer;
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
      font-size: 14px;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      display: block;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      display: block;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 20px;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>🎯 أداة سنتر الليث</h1>
      <p>إضافة المنتجات إلى فيسبوك الكتالوج تلقائياً</p>
    </div>

    <div class="message" id="message"></div>

    <div class="form-tabs">
      <button class="tab-btn active" onclick="switchTab('login')">تسجيل الدخول</button>
      <button class="tab-btn" onclick="switchTab('register')">إنشاء حساب</button>
    </div>

    <!-- تسجيل الدخول -->
    <div class="form-content active" id="login-content">
      <form id="loginForm">
        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="loginEmail" placeholder="أدخل بريدك الإلكتروني" required>
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" id="loginPassword" placeholder="أدخل كلمة المرور" required>
        </div>
        <button type="submit" class="btn-submit">تسجيل الدخول</button>
      </form>
    </div>

    <!-- إنشاء حساب -->
    <div class="form-content" id="register-content">
      <form id="registerForm">
        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="registerEmail" placeholder="أدخل بريدك الإلكتروني" required>
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" id="registerPassword" placeholder="أدخل كلمة المرور" required>
        </div>
        <div class="form-group">
          <label>تأكيد كلمة المرور</label>
          <input type="password" id="confirmPassword" placeholder="أعد إدخال كلمة المرور" required>
        </div>
        <button type="submit" class="btn-submit">إنشاء حساب</button>
      </form>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>جاري المعالجة...</p>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.form-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tab + '-content').classList.add('active');
      event.target.classList.add('active');
    }

    function showMessage(msg, type) {
      const messageEl = document.getElementById('message');
      messageEl.textContent = msg;
      messageEl.className = 'message ' + type;
      setTimeout(() => messageEl.style.display = 'none', 5000);
    }

    function showLoading(show) {
      document.getElementById('loading').style.display = show ? 'block' : 'none';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      showLoading(true);

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('loginEmail').value,
            password: document.getElementById('loginPassword').value
          })
        });

        const data = await response.json();
        showLoading(false);

        if (response.ok) {
          showMessage('✅ ' + data.message, 'success');
          setTimeout(() => window.location.href = '/dashboard', 1500);
        } else {
          showMessage('❌ ' + data.error, 'error');
        }
      } catch (error) {
        showLoading(false);
        showMessage('❌ حدث خطأ: ' + error.message, 'error');
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      showLoading(true);

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('registerEmail').value,
            password: document.getElementById('registerPassword').value,
            confirmPassword: document.getElementById('confirmPassword').value
          })
        });

        const data = await response.json();
        showLoading(false);

        if (response.ok) {
          showMessage('✅ ' + data.message, 'success');
          setTimeout(() => window.location.href = '/dashboard', 1500);
        } else {
          showMessage('❌ ' + data.error, 'error');
        }
      } catch (error) {
        showLoading(false);
        showMessage('❌ حدث خطأ: ' + error.message, 'error');
      }
    });
  </script>
</body>
</html>
